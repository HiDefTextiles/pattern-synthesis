# pattern-synthesis docs. Same HÍ look as the HiDef textíll site and the
# Sjónabók gallery (styles/ and img/hi/ are copied; refresh them with
# scripts/sync-theme.sh). Build with `make docs` from the repository root;
# data/banners.json is generated by python/explainer_data.py.
project:
  type: website
  output-dir: _site
  resources:
    - data/**
    - js/**
    - img/hi/hi_logo.svg

lang: en
bibliography: ../review/references.bib
link-citations: true

website:
  title: "Pattern synthesis"
  description: "Generating new knitting patterns in the vein of Íslensk sjónabók: methods, banners and the literature behind them."
  site-url: https://hideftextiles.github.io/pattern-synthesis/
  repo-url: https://github.com/HiDefTextiles/pattern-synthesis
  repo-actions: [issue]
  favicon: img/hi/favicon.svg
  search: true
  navbar:
    logo: img/hi/hi_named_logo-en.svg
    logo-alt: "University of Iceland"
    background: primary
    left:
      - text: "Overview"
        href: index.qmd
      - text: "Methods"
        menu:
          - href: methods/wfc.qmd
          - href: methods/sampling.qmd
          - href: methods/quilting.qmd
          - href: methods/symmetric.qmd
          - href: methods/cellular.qmd
      - text: "Banner"
        menu:
          - href: banner/spacing.qmd
          - href: banner/evolve.qmd
          - href: banner/clear.qmd
          - href: banner/frames.qmd
          - href: banner/endless.qmd
      - text: "Review"
        href: review/index.html
      - text: "Roadmap"
        href: roadmap.qmd
      - text: "About"
        href: about.qmd
    right:
      - text: "Sjónabók gallery"
        href: https://hideftextiles.github.io/Sjonabok/
    tools:
      - icon: github
        href: https://github.com/HiDefTextiles/pattern-synthesis
        aria-label: GitHub
  page-footer:
    left: |
      New patterns by Helga Ingimundardóttir, Háskóli Íslands, [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/), after public-domain
      patterns in *Íslensk sjónabók* (2009) from Þjóðminjasafn Íslands and Nationalmuseet.
    right:
      - text: "Sjónabók gallery"
        href: https://hideftextiles.github.io/Sjonabok/
      - text: "HiDef textíll"
        href: https://hideftextiles.github.io/
      - icon: github
        href: https://github.com/HiDefTextiles/pattern-synthesis
        aria-label: GitHub

format:
  html:
    theme:
      - cosmo
      - styles/hi-site.scss
      - styles/hidef.scss
      - styles/docs.scss
    css:
      - styles/hi-watermark.css
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    toc: true
    smooth-scroll: true
    anchor-sections: true
    link-external-newwindow: true
